
name: Hotel Management CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-lint:
    name: PHP Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check PHP syntax
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/hotel_management:/app" \
            -w /app \
            php:8.2-cli \
            sh -c 'find . -type f -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l'

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image with cache
        uses: docker/build-push-action@v6
        with:
          context: ./hotel_management
          tags: hotel-management:ci
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
