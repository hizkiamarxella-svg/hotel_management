services:
  web:
    build: .
    ports:
      - "8080:80"
      environment:
      DB_HOST: db
      DB_NAME: hotel_management
      DB_USER: ${MARIADB_USER:-hotel_user}
      DB_PASSWORD: ${MARIADB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-hotel_management}
      MARIADB_USER: ${MARIADB_USER:-hotel_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    ports:
      - "3307:3306"
        volumes:
      - hotel_db_data:/var/lib/mysql
      - ./hotel_management.sql:/docker-entrypoint-initdb.d/01-hotel-management.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hotel_db_data:
